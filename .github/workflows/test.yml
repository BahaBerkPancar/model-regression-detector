name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          enable-cache: true
      - name: Install core dependencies
        run: uv sync --frozen --no-extra t2s
      - name: Run tests
        run: uv run --no-extra t2s pytest
      - name: Run ruff
        run: uv run --no-extra t2s ruff check .
