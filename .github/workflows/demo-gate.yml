name: Demo regression gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: regression
            candidate: examples/t2s/candidate_regress.jsonl
            expected: REGRESSION
            expected_exit: "1"
          - name: noise
            candidate: examples/t2s/candidate_noise.jsonl
            expected: NO_CHANGE
            expected_exit: "0"
    name: ${{ matrix.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run local regression gate
        id: gate
        continue-on-error: true
        uses: ./
        with:
          suite: examples/t2s/suite.yaml
          baseline: examples/t2s/baseline.jsonl
          candidate: ${{ matrix.candidate }}
          config: examples/t2s/mrd.toml
      - name: Assert demonstrated verdict
        env:
          ACTUAL_VERDICT: ${{ steps.gate.outputs.verdict }}
          ACTUAL_EXIT: ${{ steps.gate.outputs.exit_code }}
          STEP_OUTCOME: ${{ steps.gate.outcome }}
          EXPECTED_VERDICT: ${{ matrix.expected }}
          EXPECTED_EXIT: ${{ matrix.expected_exit }}
        run: |
          test "$ACTUAL_VERDICT" = "$EXPECTED_VERDICT"
          test "$ACTUAL_EXIT" = "$EXPECTED_EXIT"
          if [[ "$EXPECTED_EXIT" == "0" ]]; then
            test "$STEP_OUTCOME" = "success"
          else
            test "$STEP_OUTCOME" = "failure"
          fi
