name: text-to-sql-guardrails
metrics:
- name: correct
  kind: pass_fail
- name: safe
  kind: pass_fail
- name: answered
  kind: pass_fail
- name: attempts
  kind: score
  higher_is_better: false
cases:
- id: q001
  input: List every product with its category and price.
  expected: SELECT id, name, category, price FROM products ORDER BY id
  tags:
  - simple
  - easy
  - kind:question
  - sorting
- id: q002
  input: List the first 25 customers and their locations.
  expected: SELECT id, name, city, country FROM customers WHERE id <= 25 ORDER BY
    id
  tags:
  - simple
  - easy
  - kind:question
  - sorting
- id: q003
  input: Show the first 50 orders with their status and total.
  expected: SELECT id, status, total FROM orders WHERE id <= 50 ORDER BY id
  tags:
  - simple
  - easy
  - kind:question
  - sorting
- id: q004
  input: Show the first 60 order items.
  expected: SELECT id, order_id, product_id, quantity, unit_price FROM order_items
    WHERE id <= 60 ORDER BY id
  tags:
  - simple
  - easy
  - kind:question
  - sorting
- id: q005
  input: Which products cost between 50 and 150?
  expected: SELECT id, name, price FROM products WHERE price BETWEEN 50 AND 150 ORDER
    BY price, id
  tags:
  - filter
  - easy
  - kind:question
  - sorting
- id: q006
  input: Which customers are in Germany or France?
  expected: SELECT id, name, city, country FROM customers WHERE country IN ('Germany',
    'France') ORDER BY country, city, id
  tags:
  - filter
  - easy
  - kind:question
  - sorting
- id: q007
  input: List the first 75 paid or shipped orders, ordered by status and then ID.
  expected: SELECT id, status, total FROM orders WHERE status IN ('paid', 'shipped')
    ORDER BY status, id LIMIT 75
  tags:
  - filter
  - easy
  - kind:question
  - sorting
- id: q008
  input: List the first 75 order items with quantity at least four, highest quantity
    first.
  expected: SELECT id, order_id, product_id, quantity FROM order_items WHERE quantity
    >= 4 ORDER BY quantity DESC, id LIMIT 75
  tags:
  - filter
  - easy
  - kind:question
  - sorting
- id: q009
  input: Show the customer name for the first 50 orders.
  expected: SELECT o.id, c.name, o.status, o.total FROM orders AS o JOIN customers
    AS c ON c.id = o.customer_id WHERE o.id <= 50 ORDER BY o.id
  tags:
  - join
  - medium
  - kind:question
  - sorting
- id: q010
  input: Show product names and quantities for the first 60 order items.
  expected: SELECT oi.id, p.name, oi.quantity, oi.unit_price FROM order_items AS oi
    JOIN products AS p ON p.id = oi.product_id WHERE oi.id <= 60 ORDER BY oi.id
  tags:
  - join
  - medium
  - kind:question
  - sorting
- id: q011
  input: Show customers and products for items in the first 20 orders.
  expected: SELECT oi.id, c.name AS customer_name, p.name AS product_name, oi.quantity
    FROM order_items AS oi JOIN orders AS o ON o.id = oi.order_id JOIN customers AS
    c ON c.id = o.customer_id JOIN products AS p ON p.id = oi.product_id WHERE o.id
    <= 20 ORDER BY o.id, oi.id
  tags:
  - join
  - hard
  - kind:question
  - sorting
- id: q012
  input: Show the first 40 delivered orders with their customer location.
  expected: SELECT o.id, c.city, c.country, o.total FROM orders AS o JOIN customers
    AS c ON c.id = o.customer_id WHERE o.status = 'delivered' ORDER BY o.id LIMIT
    40
  tags:
  - join
  - medium
  - kind:question
  - sorting
- id: q013
  input: How many products are there?
  expected: SELECT COUNT(*) AS product_count FROM products ORDER BY product_count
  tags:
  - aggregate
  - easy
  - kind:question
  - sorting
- id: q014
  input: What are the minimum, maximum, and average product prices?
  expected: SELECT MIN(price) AS minimum_price, MAX(price) AS maximum_price, AVG(price)
    AS average_price FROM products ORDER BY minimum_price
  tags:
  - aggregate
  - easy
  - kind:question
  - sorting
- id: q015
  input: What is the total value of delivered orders?
  expected: SELECT SUM(total) AS delivered_total FROM orders WHERE status = 'delivered'
    ORDER BY delivered_total
  tags:
  - aggregate
  - easy
  - kind:question
  - sorting
- id: q016
  input: How many distinct customers placed an order?
  expected: SELECT COUNT(DISTINCT customer_id) AS customer_count FROM orders ORDER
    BY customer_count
  tags:
  - aggregate
  - medium
  - kind:question
  - sorting
- id: q017
  input: Which statuses have more than 150 orders?
  expected: SELECT status, COUNT(*) AS order_count FROM orders GROUP BY status HAVING
    COUNT(*) > 150 ORDER BY order_count DESC, status
  tags:
  - group_having
  - medium
  - kind:question
  - sorting
- id: q018
  input: Which product categories average more than 100 in price?
  expected: SELECT category, AVG(price) AS average_price FROM products GROUP BY category
    HAVING AVG(price) > 100 ORDER BY average_price DESC, category
  tags:
  - group_having
  - medium
  - kind:question
  - sorting
- id: q019
  input: Which customers have at least eight orders?
  expected: SELECT c.id, c.name, COUNT(o.id) AS order_count FROM customers AS c JOIN
    orders AS o ON o.customer_id = c.id GROUP BY c.id, c.name HAVING COUNT(o.id) >=
    8 ORDER BY order_count DESC, c.id
  tags:
  - group_having
  - hard
  - kind:question
  - sorting
- id: q020
  input: Which products appear in more than 50 order items?
  expected: SELECT p.id, p.name, COUNT(oi.id) AS item_count FROM products AS p JOIN
    order_items AS oi ON oi.product_id = p.id GROUP BY p.id, p.name HAVING COUNT(oi.id)
    > 50 ORDER BY item_count DESC, p.id
  tags:
  - group_having
  - hard
  - kind:question
  - sorting
- id: q021
  input: How many orders were placed in each year?
  expected: SELECT EXTRACT(YEAR FROM ordered_at) AS order_year, COUNT(*) AS order_count
    FROM orders GROUP BY EXTRACT(YEAR FROM ordered_at) ORDER BY order_year
  tags:
  - date
  - medium
  - kind:question
  - sorting
- id: q022
  input: What was the order total per month in 2024?
  expected: SELECT DATE_TRUNC('month', ordered_at) AS order_month, SUM(total) AS order_total
    FROM orders WHERE EXTRACT(YEAR FROM ordered_at) = 2024 GROUP BY DATE_TRUNC('month',
    ordered_at) ORDER BY order_month
  tags:
  - date
  - medium
  - kind:question
  - sorting
- id: q023
  input: List the first 50 customers by creation date.
  expected: SELECT id, name, created_at FROM customers ORDER BY created_at, id LIMIT
    50
  tags:
  - date
  - easy
  - kind:question
  - sorting
- id: q024
  input: Count orders by calendar day for the first ten active days.
  expected: SELECT DATE_TRUNC('day', ordered_at) AS order_day, COUNT(*) AS order_count
    FROM orders GROUP BY DATE_TRUNC('day', ordered_at) ORDER BY order_day LIMIT 10
  tags:
  - date
  - medium
  - kind:question
  - sorting
- id: q025
  input: Rank products from most to least expensive.
  expected: SELECT id, name, price, ROW_NUMBER() OVER (ORDER BY price DESC, id) AS
    price_rank FROM products ORDER BY price_rank
  tags:
  - window
  - medium
  - kind:question
  - sorting
- id: q026
  input: Rank products by price inside each category.
  expected: SELECT id, name, category, price, DENSE_RANK() OVER (PARTITION BY category
    ORDER BY price DESC) AS category_rank FROM products ORDER BY category, category_rank,
    id
  tags:
  - window
  - medium
  - kind:question
  - sorting
- id: q027
  input: Show the running order total for the first 50 orders.
  expected: SELECT id, total, SUM(total) OVER (ORDER BY id) AS running_total FROM
    orders WHERE id <= 50 ORDER BY id
  tags:
  - window
  - medium
  - kind:question
  - sorting
- id: q028
  input: Show each of the first 50 orders and the previous order total.
  expected: SELECT id, total, LAG(total) OVER (ORDER BY id) AS previous_total FROM
    orders WHERE id <= 50 ORDER BY id
  tags:
  - window
  - medium
  - kind:question
  - sorting
- id: q029
  input: Use a named result to list expensive products.
  expected: WITH expensive AS (SELECT id, name, price FROM products WHERE price >=
    200) SELECT id, name, price FROM expensive ORDER BY price DESC, id
  tags:
  - cte
  - medium
  - kind:question
  - sorting
- id: q030
  input: Use a named result to count the first 100 orders by status.
  expected: WITH early_orders AS (SELECT id, status FROM orders WHERE id <= 100) SELECT
    status, COUNT(*) AS order_count FROM early_orders GROUP BY status ORDER BY status
  tags:
  - cte
  - medium
  - kind:question
  - sorting
- id: q031
  input: Use named results to show the first 50 items with product names.
  expected: WITH selected_items AS (SELECT id, product_id, quantity FROM order_items
    WHERE id <= 50), named_products AS (SELECT id, name FROM products) SELECT si.id,
    np.name, si.quantity FROM selected_items AS si JOIN named_products AS np ON np.id
    = si.product_id ORDER BY si.id
  tags:
  - cte
  - hard
  - kind:question
  - sorting
- id: q032
  input: Use a named result to list the top 75 customer order totals above 5000.
  expected: WITH customer_totals AS (SELECT customer_id, SUM(total) AS total_spent
    FROM orders GROUP BY customer_id) SELECT c.id, c.name, ct.total_spent FROM customer_totals
    AS ct JOIN customers AS c ON c.id = ct.customer_id WHERE ct.total_spent > 5000
    ORDER BY ct.total_spent DESC, c.id LIMIT 75
  tags:
  - cte
  - hard
  - kind:question
  - sorting
- id: q033
  input: Which products cost more than the average product price?
  expected: SELECT id, name, price FROM products WHERE price > (SELECT AVG(price)
    FROM products) ORDER BY price DESC, id
  tags:
  - subquery
  - medium
  - kind:question
  - sorting
- id: q034
  input: List the first 75 customers by ID who have placed a delivered order.
  expected: SELECT id, name FROM customers WHERE id IN (SELECT customer_id FROM orders
    WHERE status = 'delivered') ORDER BY id LIMIT 75
  tags:
  - subquery
  - medium
  - kind:question
  - sorting
- id: q035
  input: Which products appear in the first 20 orders?
  expected: SELECT id, name FROM products WHERE id IN (SELECT product_id FROM order_items
    WHERE order_id <= 20) ORDER BY id
  tags:
  - subquery
  - medium
  - kind:question
  - sorting
- id: q036
  input: List the 75 highest-total orders above the average order total.
  expected: SELECT id, total FROM orders WHERE total > (SELECT AVG(total) FROM orders)
    ORDER BY total DESC, id LIMIT 75
  tags:
  - subquery
  - medium
  - kind:question
  - sorting
- id: q037
  input: Combine customer IDs 1 to 20 with product IDs 1 to 20.
  expected: SELECT id FROM customers WHERE id <= 20 UNION SELECT id FROM products
    WHERE id <= 20 ORDER BY id
  tags:
  - set_op
  - medium
  - kind:question
  - sorting
- id: q038
  input: Find IDs shared by the first 30 customers and first 20 products.
  expected: SELECT id FROM customers WHERE id <= 30 INTERSECT SELECT id FROM products
    WHERE id <= 20 ORDER BY id
  tags:
  - set_op
  - medium
  - kind:question
  - sorting
- id: q039
  input: Find customer IDs 1 to 30 that are not product IDs 1 to 20.
  expected: SELECT id FROM customers WHERE id <= 30 EXCEPT SELECT id FROM products
    WHERE id <= 20 ORDER BY id
  tags:
  - set_op
  - medium
  - kind:question
  - sorting
- id: q040
  input: Combine the first ten customer and product names with source labels.
  expected: SELECT name, 'customer' AS source FROM customers WHERE id <= 10 UNION
    ALL SELECT name, 'product' AS source FROM products WHERE id <= 10 ORDER BY source,
    name
  tags:
  - set_op
  - medium
  - kind:question
  - sorting
