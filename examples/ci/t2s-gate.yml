name: Text-to-SQL model regression gate

on:
  pull_request:
    paths:
      - src/text_to_sql_guardrails/llm/**
      - src/text_to_sql_guardrails/pipeline.py
      - src/text_to_sql_guardrails/guard/**
      - config/**
      - bench/mrd-suite.yaml
      - bench/recorded_generations.jsonl
      - baselines/t2s.jsonl

# The job only reads repository contents. It does not write comments, checks, or artifacts.
permissions:
  contents: read

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
      - name: Install project
        run: uv sync --frozen
      # TODO: Before enabling, replace every all-zero SHA below with the full commit SHA of the
      # first reviewed model-regression-detector release.
      - name: Generate candidate from recorded outputs
        if: vars.MRD_ALLOW_SPEND != '1'
        env:
          MRD_T2S_ROOT: ${{ github.workspace }}
          TEST_DATABASE_URL: postgresql+psycopg://app:app@127.0.0.1:5432/app
        run: |
          uv run --frozen --with \
            "model-regression-detector @ git+https://github.com/BahaBerkPancar/model-regression-detector@0000000000000000000000000000000000000000" \
            mrd run --adapter t2s --generator recorded:bench/recorded_generations.jsonl \
              --suite bench/mrd-suite.yaml --out candidate.jsonl --variant pull-request
      - name: Generate candidate from live model
        if: vars.MRD_ALLOW_SPEND == '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MRD_LIVE_MODEL: ${{ vars.MRD_LIVE_MODEL }}
          MRD_T2S_ROOT: ${{ github.workspace }}
          TEST_DATABASE_URL: postgresql+psycopg://app:app@127.0.0.1:5432/app
        run: |
          test -n "$ANTHROPIC_API_KEY"
          test -n "$MRD_LIVE_MODEL"
          uv run --frozen --with \
            "model-regression-detector @ git+https://github.com/BahaBerkPancar/model-regression-detector@0000000000000000000000000000000000000000" \
            mrd run --adapter t2s --generator anthropic --yes-spend --model "$MRD_LIVE_MODEL" \
              --suite bench/mrd-suite.yaml --out candidate.jsonl --variant pull-request
      - name: Compare with accepted baseline
        uses: BahaBerkPancar/model-regression-detector@0000000000000000000000000000000000000000
        with:
          suite: bench/mrd-suite.yaml
          baseline: baselines/t2s.jsonl
          candidate: candidate.jsonl
          config: config/mrd.toml
