name: Model regression gate
description: Compare a candidate eval run with a stored baseline and fail on regression.
inputs:
  suite:
    description: Path to the evaluation suite YAML.
    required: true
  baseline:
    description: Path to the accepted baseline JSONL.
    required: true
  candidate:
    description: Path to the candidate run JSONL.
    required: true
  config:
    description: Optional path to mrd.toml.
    required: false
    default: ""
  inconclusive-ok:
    description: Return success when the comparison is inconclusive.
    required: false
    default: "false"
  python-version:
    description: Python version used to run mrd.
    required: false
    default: "3.12"
outputs:
  verdict:
    description: REGRESSION, IMPROVEMENT, NO_CHANGE, or INCONCLUSIVE.
    value: ${{ steps.compare.outputs.verdict }}
  exit_code:
    description: The mrd exit code.
    value: ${{ steps.compare.outputs.exit_code }}
  regressed_metrics:
    description: Comma-separated names of statistically regressed metrics.
    value: ${{ steps.compare.outputs.regressed_metrics }}
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
      with:
        enable-cache: true
    - name: Compare runs
      id: compare
      shell: bash
      env:
        MRD_SUITE: ${{ inputs.suite }}
        MRD_BASELINE: ${{ inputs.baseline }}
        MRD_CANDIDATE: ${{ inputs.candidate }}
        MRD_CONFIG: ${{ inputs.config }}
        MRD_INCONCLUSIVE_OK: ${{ inputs.inconclusive-ok }}
        MRD_PYTHON: ${{ inputs.python-version }}
      run: |
        args=(compare --suite "$MRD_SUITE" --baseline "$MRD_BASELINE" --candidate "$MRD_CANDIDATE")
        if [[ -n "$MRD_CONFIG" ]]; then
          args+=(--config "$MRD_CONFIG")
        fi
        if [[ "$MRD_INCONCLUSIVE_OK" == "true" ]]; then
          args+=(--inconclusive-ok)
        fi
        uv run --project "$GITHUB_ACTION_PATH" --frozen --no-extra t2s \
          --python "$MRD_PYTHON" mrd "${args[@]}"
