<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">model-regression-detector architecture</title>
  <desc id="desc">An evaluation suite flows through baseline and candidate adapter runs, paired statistical comparison, a verdict, and a CI gate.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="1200" height="300" rx="18" fill="#0d1117"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle">
    <text x="600" y="42" fill="#f0f6fc" font-size="24" font-weight="700">A paired regression gate, end to end</text>
    <g fill="#161b22" stroke="#30363d" stroke-width="2">
      <rect x="35" y="95" width="175" height="120" rx="12"/>
      <rect x="265" y="75" width="215" height="160" rx="12"/>
      <rect x="535" y="75" width="220" height="160" rx="12"/>
      <rect x="810" y="95" width="150" height="120" rx="12"/>
      <rect x="1015" y="95" width="150" height="120" rx="12"/>
    </g>
    <g fill="none" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)">
      <path d="M 210 155 L 255 155"/>
      <path d="M 480 155 L 525 155"/>
      <path d="M 755 155 L 800 155"/>
      <path d="M 960 155 L 1005 155"/>
    </g>
    <g fill="#f0f6fc" font-size="18" font-weight="650">
      <text x="122" y="137">Eval suite</text>
      <text x="372" y="111">Adapter runs</text>
      <text x="645" y="111">Paired compare</text>
      <text x="885" y="137">Verdict</text>
      <text x="1090" y="137">CI gate</text>
    </g>
    <g fill="#8b949e" font-size="14">
      <text x="122" y="164">cases + metrics</text>
      <text x="122" y="187">YAML</text>
      <text x="372" y="140">baseline JSONL</text>
      <text x="372" y="165">candidate JSONL</text>
      <text x="372" y="198">offline or live adapter</text>
      <text x="645" y="140">McNemar / sign-flip</text>
      <text x="645" y="165">paired bootstrap CI</text>
      <text x="645" y="190">Holm tag slices</text>
      <text x="885" y="166">NO_CHANGE /</text>
      <text x="885" y="189" fill="#f85149">REGRESSION / …</text>
      <text x="1090" y="166">job summary</text>
      <text x="1090" y="189">exit code</text>
    </g>
  </g>
</svg>
