[project]
name = "model-regression-detector"
version = "0.1.0"
description = "Catches worse answers from prompt or model changes before they ship: runs an eval suite against a baseline and fails CI on statistically significant regressions (first target: text-to-sql-guardrails)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
t2s = ["text-to-sql-guardrails"]

[project.scripts]
mrd = "model_regression_detector.cli:main"
model-regression-detector = "model_regression_detector.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv.sources]
text-to-sql-guardrails = { path = "../text-to-sql-guardrails" }

[tool.pytest.ini_options]
markers = [
    "t2s: requires the optional text-to-sql-guardrails adapter dependency",
    "pg: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
